<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mahjong_scoreboard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=20260303"/>

  <title>mahjong_scoreboard</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Cleanup legacy Flutter service worker caches to avoid stale client code.
    (function () {
      if (!('serviceWorker' in navigator)) {
        return;
      }

      window.addEventListener('load', async () => {
        const registrations = await navigator.serviceWorker.getRegistrations();
        let unregistered = false;

        for (const registration of registrations) {
          const urls = [
            registration.active?.scriptURL ?? '',
            registration.waiting?.scriptURL ?? '',
            registration.installing?.scriptURL ?? '',
          ];

          if (urls.some((url) => url.includes('flutter_service_worker.js'))) {
            await registration.unregister();
            unregistered = true;
          }
        }

        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(
            cacheNames
              .filter((name) =>
                name === 'flutter-app-cache' ||
                name === 'flutter-app-manifest' ||
                name === 'flutter-temp-cache')
              .map((name) => caches.delete(name)),
          );
        }

        if (unregistered && !sessionStorage.getItem('flutter-sw-cleaned')) {
          sessionStorage.setItem('flutter-sw-cleaned', '1');
          location.reload();
        }
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
